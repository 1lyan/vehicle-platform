global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'user-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['user-service:3000']

  - job_name: 'vehicle-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['vehicle-service:3000']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
